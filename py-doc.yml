# py-doc project: every poster under posters/, built to build/ with a one-page PDF of each.
#   py-doc poster                 every poster
#   py-doc poster git --watch     one, rebuilt and reloaded on every save
#   py-doc poster --pdf           every poster and its PDF
# CI checks that every Markdown file under posters/ has an entry here.

poster:
  pdf: true
  version: git                    # the release tag, such as v1.2.0, under the footer
  embed_fonts: [latin, latin-ext] # the page looks the same offline

